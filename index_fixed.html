<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Windows</title>

<style>
*{box-sizing:border-box}
:root{
  --accent:#60a5fa;
  --glass:rgba(30,35,48,.78);
  --text:#fff;
}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  font-family:"Segoe UI",Arial,sans-serif;color:var(--text);
}
body{background:#07142d}
button,input,textarea{font:inherit}
button{
  color:inherit;border:0;cursor:pointer;
  background:rgba(255,255,255,.1);
  border-radius:8px;padding:9px 12px;
}
button:hover{background:rgba(255,255,255,.2)}
input,textarea{
  background:rgba(0,0,0,.16);color:inherit;
  border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:10px;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
.hidden{display:none!important}

/* 起動画面 */
#boot{
  position:fixed;inset:0;z-index:1000;
  background:#050505;display:flex;
  align-items:center;justify-content:center;
  flex-direction:column;gap:35px;
}
.bootlogo{
  font-size:65px;font-weight:700;
  letter-spacing:-5px;
}
.bootlogo span{color:#60a5fa}
.loader{
  width:42px;height:42px;border-radius:50%;
  border:3px solid #333;border-top-color:white;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ログイン */
#login{
 position:fixed;inset:0;z-index:900;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;
 background:linear-gradient(140deg,#1e3a8a,#07142d,#174f75);
}
.usercircle{
 width:100px;height:100px;border-radius:50%;
 background:rgba(255,255,255,.17);
 display:grid;place-items:center;font-size:55px;
 margin-bottom:18px;
}
#login input{width:240px;text-align:center}
#login button{margin-top:12px;width:240px;background:#2778cf}
#loginError{color:#ffd0d0;margin-top:10px}

/* デスクトップ */
#desktop{
 position:fixed;inset:0 0 48px 0;
 background-size:cover;background-position:center;
 overflow:hidden;
}
#icons{
 position:absolute;left:10px;top:10px;
 display:flex;flex-direction:column;flex-wrap:wrap;
 gap:8px;max-height:95%;align-content:flex-start;
}
.desktopIcon{
 width:85px;height:85px;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 gap:4px;border-radius:8px;
 cursor:pointer;text-align:center;
 font-size:12px;text-shadow:0 1px 4px #000;
}
.desktopIcon:hover{background:rgba(255,255,255,.16)}
.desktopIcon .ico{font-size:35px}
.desktopIcon span:last-child{max-width:80px}

/* タスクバー */
#taskbar{
 position:fixed;bottom:0;left:0;right:0;height:48px;
 display:flex;align-items:center;justify-content:center;
 gap:5px;background:rgba(22,28,40,.78);
 backdrop-filter:blur(22px);
 border-top:1px solid rgba(255,255,255,.12);
 z-index:500;
}
.taskbtn{height:40px;min-width:40px;font-size:19px}
#taskRight{
 position:absolute;right:10px;height:100%;
 display:flex;align-items:center;gap:8px;font-size:12px;
}
#clock{cursor:pointer;text-align:center;line-height:1.3;padding:4px}
#startBtn{font-size:21px}
#searchTask{width:160px;height:34px;border-radius:20px}

/* スタート */
#startMenu,#searchMenu,#quickPanel,#calendarPanel{
 position:fixed;bottom:55px;
 background:rgba(30,35,48,.94);
 backdrop-filter:blur(25px);
 border:1px solid rgba(255,255,255,.13);
 border-radius:14px;padding:16px;
 z-index:600;box-shadow:0 15px 50px #0005;
}
#startMenu{
 width:360px;left:50%;transform:translateX(-50%);
 max-height:75vh;overflow:auto;
}
#searchMenu{
 left:50%;transform:translateX(-50%);
 width:min(500px,95vw);max-height:70vh;overflow:auto;
}
#quickPanel{right:10px;width:300px}
#calendarPanel{right:10px;width:310px}
.menuTitle{font-weight:bold;margin-bottom:12px}
.appgrid{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;margin:12px 0;
}
.appTile{
 min-height:70px;display:flex;
 align-items:center;justify-content:center;
 flex-direction:column;gap:4px;
 font-size:13px;
}
.appTile b{font-size:27px}
.menuBottom{display:flex;justify-content:space-between;margin-top:12px}
.result{
 padding:10px;border-radius:8px;cursor:pointer;
 display:flex;gap:12px;align-items:center;
}
.result:hover{background:rgba(255,255,255,.12)}

/* ウィンドウ */
.window{
 position:absolute;
 width:min(850px,94vw);
 height:min(600px,80vh);
 min-width:300px;min-height:230px;
 background:rgba(245,247,250,.97);
 color:#20232b;border-radius:12px;
 box-shadow:0 20px 60px #0005;
 overflow:hidden;display:flex;flex-direction:column;
}
.window.active{outline:1px solid rgba(255,255,255,.15)}
.winHeader{
 height:42px;flex-shrink:0;
 display:flex;align-items:center;
 padding:0 8px 0 12px;
 background:rgba(230,235,243,.95);
 cursor:move;user-select:none;
}
.winTitle{flex:1;font-size:13px}
.winBtns{display:flex;gap:3px}
.winBtns button{
 color:#333;background:transparent;
 width:36px;height:32px;padding:0;
 border-radius:5px;
}
.winBtns button:hover{background:#ddd}
.winBtns .close:hover{background:#e81123;color:white}
.winContent{flex:1;overflow:auto;padding:15px}
.window.maximized{
 left:0!important;top:0!important;
 width:100%!important;height:calc(100vh - 48px)!important;
 border-radius:0;
}
.window.minimized{display:none}

/* 設定 */
.settingsNav{
 display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;
}
.settingsNav button{color:#222;background:#e4e8ef}
.settingsNav button.sel{background:#bcdcff}
.settingCard{
 background:#fff;border:1px solid #e1e5ea;
 border-radius:12px;padding:15px;margin-bottom:12px;
}
.settingCard h3{margin:0 0 10px;font-size:17px}
.settingCard p{font-size:13px;color:#555}
.settingCard input{color:#222;background:#fff}
.wallGrid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.wall{
 height:80px;border-radius:10px;cursor:pointer;
 border:3px solid transparent;
}
.wall.sel{border-color:#1684ff}
.previewCursor{
 min-height:130px;background:#f0f3f8;
 border-radius:12px;color:#333;
 display:grid;place-items:center;
 cursor:crosshair;
}

/* Edge: ウィンドウ内でブラウザ表示が縦いっぱいに伸びるよう修正 */
.window[data-app="edge"]{
  display:flex;
  flex-direction:column;
  width:min(1100px,96vw);
  height:min(780px,calc(100vh - 80px));
  max-height:calc(100vh - 56px);
}
.window[data-app="edge"] .winHeader{flex:0 0 42px}
.window[data-app="edge"] .winContent{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:0!important;
  overflow:hidden;
}
.window[data-app="edge"] .edgeTabs,
.window[data-app="edge"] .edgeToolbar{flex:0 0 auto}
.window[data-app="edge"] .edgeArea{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  overflow:hidden;
}
.window[data-app="edge"] .edgeFrame{
  display:block;
  width:100%;
  height:100%;
  flex:1 1 auto;
  min-height:0;
  border:0;
  background:white;
}
.edgeToolbar{
 display:flex;gap:5px;align-items:center;
 background:#e9edf4;padding:7px;
}
.edgeToolbar input{flex:1;color:#222;background:white;min-width:0}
.edgeFrame{width:100%;height:100%;border:0;background:white}
.edgeBody{padding:0!important;display:flex;flex-direction:column}
.edgeArea{flex:1;min-height:0}
.edgeTabs{display:flex;background:#dce3ec;gap:4px;padding:4px}
.edgeTab{padding:5px 10px;color:#333;background:#eef2f8}
.edgeTab.active{background:white}

/* メモ帳 */
.noteArea{
 width:100%;height:100%;resize:none;
 color:#222;background:white;border:0;
 border-radius:0;font-family:Consolas,monospace;
}
.noteTools{display:flex;gap:6px;margin-bottom:8px}

/* 電卓 */
.calc{
 max-width:340px;margin:auto;
 display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
}
.calc input{grid-column:span 4;text-align:right;font-size:24px}
.calc button{font-size:18px;background:#e5eaf1;color:#222}
.calc button:hover{background:#d1dce9}

/* ペイント */
.paintTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paintCanvas{
 background:white;border:1px solid #ccc;
 touch-action:none;display:block;
}

/* ファイル */
.fileRow{
 padding:10px;border-radius:7px;cursor:pointer;
 display:flex;gap:12px;align-items:center;
}
.fileRow:hover{background:#e7edf5}
.fileRow .fileico{font-size:24px}

/* 通知 */
#toast{
 position:fixed;right:15px;bottom:60px;
 background:rgba(30,35,48,.95);
 border-radius:10px;padding:13px 20px;
 z-index:999;box-shadow:0 5px 30px #0004;
 animation:fade 4s forwards;
}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0;pointer-events:none}}

@media(max-width:600px){
 #searchTask{display:none}
 #taskRight{right:4px}
 #startMenu{width:95vw}
 .window{width:96vw!important;left:2vw!important}
 .appgrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<!-- 起動 -->
<div id="boot">
  <div class="bootlogo"><span>⊞</span> Windows</div>
  <div class="loader"></div>
  <button onclick="showLogin()">起動する</button>
</div>

<!-- ログイン -->
<div id="login" class="hidden">
  <div class="usercircle">👤</div>
  <h2 id="loginName">ユーザー</h2>
  <input id="pin" type="password" placeholder="PIN（空欄でもOK）">
  <button onclick="enterDesktop()">ログイン</button>
  <div id="loginError"></div>
</div>

<!-- デスクトップ -->
<div id="desktop" class="hidden">
  <div id="icons"></div>
</div>

<!-- スタートメニュー -->
<div id="startMenu" class="hidden">
  <div class="menuTitle">スタート</div>
  <input id="startSearch" placeholder="アプリを検索..." style="width:100%">
  <div class="appgrid" id="startApps"></div>
  <div class="menuBottom">
    <button onclick="openApp('settings')">⚙️ 設定</button>
    <button onclick="showLogin()">⏻ 電源</button>
  </div>
</div>

<!-- 検索 -->
<div id="searchMenu" class="hidden">
  <div class="menuTitle">検索</div>
  <input id="searchInput" placeholder="検索する..." style="width:100%">
  <div id="searchResults"></div>
</div>

<!-- クイック設定 -->
<div id="quickPanel" class="hidden">
  <div class="menuTitle">クイック設定</div>
  <div class="appgrid">
    <button onclick="toggleTheme()">🌙<br>テーマ</button>
    <button onclick="openApp('settings')">⚙️<br>設定</button>
    <button onclick="notify('Wi-Fi設定はシミュレーションです')">📶<br>Wi-Fi</button>
    <button onclick="notify('Bluetooth設定はシミュレーションです')">ᛒ<br>Bluetooth</button>
  </div>
  <label>音量</label>
  <input type="range" min="0" max="100" value="70" style="width:100%">
  <label>明るさ</label>
  <input type="range" min="0" max="100" value="100" style="width:100%">
</div>

<!-- カレンダー -->
<div id="calendarPanel" class="hidden">
  <h3 id="calendarDate"></h3>
  <div id="calendarText"></div>
</div>

<!-- タスクバー -->
<div id="taskbar" class="hidden">
  <button class="taskbtn" id="startBtn" onclick="toggleMenu('startMenu')">⊞</button>
  <input id="searchTask" placeholder="🔎 検索" onclick="toggleMenu('searchMenu')">
  <div id="taskApps"></div>
  <div id="taskRight">
    <button onclick="toggleMenu('quickPanel')">📶 🔊 🔋</button>
    <div id="clock" onclick="toggleMenu('calendarPanel')"></div>
  </div>
</div>

<script>
/* ===== 基本設定 ===== */
const $=id=>document.getElementById(id);
const STORE="webWindowsSettings";

let settings=JSON.parse(localStorage.getItem(STORE)||"{}");
settings.name=settings.name||"ユーザー";
settings.pin=settings.pin||"";
settings.theme=settings.theme||"dark";
settings.wall=settings.wall||0;
settings.cursorSize=settings.cursorSize||32;
settings.cursorColor=settings.cursorColor||"white";
settings.cursorImage=settings.cursorImage||"";
settings.accent=settings.accent||"#60a5fa";

function saveSettings(){
 localStorage.setItem(STORE,JSON.stringify(settings));
}
const apps=[
 {id:"edge",name:"Microsoft Edge",ico:"🌐"},
 {id:"settings",name:"設定",ico:"⚙️"},
 {id:"note",name:"メモ帳",ico:"📝"},
 {id:"calc",name:"電卓",ico:"🧮"},
 {id:"paint",name:"ペイント",ico:"🎨"},
 {id:"files",name:"ファイル",ico:"📁"},
 {id:"calendar",name:"カレンダー",ico:"📅"},
 {id:"about",name:"このPCについて",ico:"💻"}
];
let windows={},z=20,activeWindow=null;
let wallpaperList=[
 "linear-gradient(135deg,#0f3b77,#070b28 60%,#2475a9)",
 "linear-gradient(135deg,#7c3aed,#111827 60%,#db2777)",
 "linear-gradient(135deg,#14532d,#071b34 60%,#0e7490)",
 "linear-gradient(135deg,#b45309,#431407 60%,#f97316)",
 "linear-gradient(135deg,#111827,#374151 60%,#6d28d9)",
 "linear-gradient(135deg,#be185d,#4c1d95 60%,#1d4ed8)"
];

/* ===== 起動 ===== */
setTimeout(()=>{$("boot").classList.remove("hidden")},100);

function showLogin(){
 $("boot").classList.add("hidden");
 $("desktop").classList.add("hidden");
 $("taskbar").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("loginName").textContent=settings.name;
 $("pin").value="";
 $("loginError").textContent="";
}

function enterDesktop(){
 if(settings.pin && $("pin").value!==settings.pin){
  $("loginError").textContent="PINが違います";
  return;
 }
 $("login").classList.add("hidden");
 $("desktop").classList.remove("hidden");
 $("taskbar").classList.remove("hidden");
 applySettings();
 buildIcons();
 updateClock();
}

/* ===== デスクトップ ===== */
function applySettings(){
 document.documentElement.style.setProperty("--accent",settings.accent);
 $("desktop").style.background=wallpaperList[settings.wall]||wallpaperList[0];

 if(settings.theme==="light"){
  document.documentElement.style.setProperty("--glass","rgba(230,235,245,.85)");
 }else{
  document.documentElement.style.setProperty("--glass","rgba(30,35,48,.78)");
 }

 if(settings.cursorImage){
  document.body.style.cursor=
   `url("${settings.cursorImage}") 0 0, auto`;
 }else{
  document.body.style.cursor=
   settings.cursorColor==="white"?"default":
   settings.cursorColor;
 }
}

function buildIcons(){
 $("icons").innerHTML="";
 apps.forEach(a=>{
  let d=document.createElement("div");
  d.className="desktopIcon";
  d.innerHTML=`<span class="ico">${a.ico}</span><span>${a.name}</span>`;
  d.ondblclick=()=>openApp(a.id);
  d.onclick=()=>{d.style.background="rgba(255,255,255,.2)"};
  $("icons").append(d);
 });
 buildStart();
}

function buildStart(filter=""){
 $("startApps").innerHTML="";
 apps.filter(a=>a.name.toLowerCase().includes(filter.toLowerCase()))
 .forEach(a=>{
  let b=document.createElement("button");
  b.className="appTile";
  b.innerHTML=`<b>${a.ico}</b>${a.name}`;
  b.onclick=()=>{closeMenus();openApp(a.id)};
  $("startApps").append(b);
 });
}

$("startSearch").oninput=e=>buildStart(e.target.value);

function toggleMenu(id){
 const el=$(id);
 const was=el.classList.contains("hidden");
 closeMenus();
 if(was)el.classList.remove("hidden");
 if(id==="searchMenu")$("searchInput").focus();
}
function closeMenus(){
 ["startMenu","searchMenu","quickPanel","calendarPanel"]
 .forEach(id=>$(id).classList.add("hidden"));
}
document.addEventListener("click",e=>{
 if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn")&&
    !e.target.closest("#searchMenu")&&!e.target.closest("#searchTask")&&
    !e.target.closest("#quickPanel")&&!e.target.closest("#calendarPanel")){
  closeMenus();
 }
});

/* ===== 時計 ===== */
function updateClock(){
 const now=new Date();
 $("clock").innerHTML=
 now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+
 "<br>"+now.toLocaleDateString("ja-JP");
 $("calendarDate").textContent=now.toLocaleDateString("ja-JP",{
  year:"numeric",month:"long",day:"numeric",weekday:"long"
 });
 $("calendarText").innerHTML="<p>今日の予定</p><p>予定はありません</p>";
}
setInterval(updateClock,1000);

/* ===== 検索 ===== */
function doSearch(q){
 if(!q)return;
 let results=[];
 apps.forEach(a=>{
  if(a.name.toLowerCase().includes(q.toLowerCase()))
   results.push(`<div class="result" onclick="openApp('${a.id}');closeMenus()">${a.ico} ${a.name}</div>`);
 });
 results.push(`<div class="result" onclick="openApp('edge','https://www.bing.com/search?q='+encodeURIComponent('${q.replace(/'/g,"\\'")}'));closeMenus()">🌐 Web検索：${q}</div>`);
 $("searchResults").innerHTML=results.join("");
}
$("searchInput").oninput=e=>doSearch(e.target.value);
$("searchInput").onkeydown=e=>{
 if(e.key==="Enter")openApp("edge","https://www.bing.com/search?q="+encodeURIComponent(e.target.value));
};
$("searchTask").onkeydown=e=>{
 if(e.key==="Enter"){
  openApp("edge","https://www.bing.com/search?q="+encodeURIComponent(e.target.value));
 }
};

/* ===== 通知 ===== */
function notify(msg){
 let t=document.createElement("div");
 t.id="toast";t.textContent=msg;
 document.body.append(t);
 setTimeout(()=>t.remove(),4000);
}

/* ===== ウィンドウ ===== */
function openApp(id,arg){
 closeMenus();

 if(windows[id]){
  const w=windows[id];
  w.classList.remove("minimized");
  focusWindow(w);
  if(id==="edge"&&arg)navigateEdge(w,arg);
  return;
 }

 const app=apps.find(a=>a.id===id);
 if(!app)return;

 const w=document.createElement("div");
 w.className="window";
 w.style.left=(80+Math.random()*100)+"px";
 w.style.top=(50+Math.random()*70)+"px";
 w.style.zIndex=++z;
 w.dataset.app=id;

 let content="";
 if(id==="settings")content=settingsApp();
 if(id==="edge")content=edgeApp(arg||"https://www.bing.com");
 if(id==="note")content=noteApp();
 if(id==="calc")content=calcApp();
 if(id==="paint")content=paintApp();
 if(id==="files")content=filesApp();
 if(id==="calendar")content=calendarApp();
 if(id==="about")content=aboutApp();

 w.innerHTML=`
 <div class="winHeader">
  <span class="winTitle">${app.ico} ${app.name}</span>
  <div class="winBtns">
   <button onclick="minimizeWindow('${id}')">－</button>
   <button onclick="maximizeWindow('${id}')">□</button>
   <button class="close" onclick="closeWindow('${id}')">×</button>
  </div>
 </div>
 <div class="winContent" id="content-${id}">${content}</div>`;

 $("desktop").append(w);
 windows[id]=w;
 focusWindow(w);
 makeDraggable(w);
 buildTaskApps();

 if(id==="paint")initPaint();
 if(id==="settings")initSettings();
 if(id==="note")initNote();
 if(id==="calc")initCalc();
 if(id==="edge")initEdge(arg);
}

function focusWindow(w){
 z++;w.style.zIndex=z;activeWindow=w;
 document.querySelectorAll(".window").forEach(x=>x.classList.remove("active"));
 w.classList.add("active");
}
function closeWindow(id){
 if(windows[id])windows[id].remove();
 delete windows[id];buildTaskApps();
}
function minimizeWindow(id){
 windows[id].classList.add("minimized");
 buildTaskApps();
}
function maximizeWindow(id){
 let w=windows[id];
 w.classList.toggle("maximized");
}
function buildTaskApps(){
 $("taskApps").innerHTML="";
 Object.keys(windows).forEach(id=>{
  const a=apps.find(x=>x.id===id);
  let b=document.createElement("button");
  b.className="taskbtn";
  b.textContent=a.ico;
  b.onclick=()=>{
   if(windows[id].classList.contains("minimized")){
    windows[id].classList.remove("minimized");
   }else{
    focusWindow(windows[id]);
   }
  };
  $("taskApps").append(b);
 });
}
function makeDraggable(w){
 const h=w.querySelector(".winHeader");
 let dx=0,dy=0,drag=false;
 h.addEventListener("mousedown",e=>{
  if(e.target.closest("button"))return;
  if(w.classList.contains("maximized"))return;
  drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;
  focusWindow(w);
 });
 document.addEventListener("mousemove",e=>{
  if(!drag)return;
  w.style.left=Math.max(0,e.clientX-dx)+"px";
  w.style.top=Math.max(0,e.clientY-dy)+"px";
 });
 document.addEventListener("mouseup",()=>drag=false);
 w.addEventListener("mousedown",()=>focusWindow(w));
}

/* ===== 設定 ===== */
function settingsApp(){
 return `
 <div class="settingsNav">
 <button class="sel" onclick="settingsTab('personal')">個人設定</button>
 <button onclick="settingsTab('cursor')">カーソル</button>
 <button onclick="settingsTab('system')">システム</button>
 <button onclick="settingsTab('account')">アカウント</button>
 </div>
 <div id="settingsBody"></div>`;
}
function initSettings(){settingsTab("personal")}
function settingsTab(tab){
 const b=$("settingsBody");
 if(!b)return;
 if(tab==="personal"){
  b.innerHTML=`
  <div class="settingCard">
   <h3>テーマ</h3>
   <button onclick="setTheme('dark')">🌙 ダーク</button>
   <button onclick="setTheme('light')">☀️ ライト</button>
  </div>
  <div class="settingCard">

/* ===== Edge ===== */
function edgeApp(url){
 return `
 <div class="edgeTabs">
  <div class="edgeTab active">🌐 新しいタブ</div>
  <button onclick="edgeNewTab()">＋</button>
 </div>
 <div class="edgeToolbar">
  <button onclick="edgeBack()">←</button>
  <button onclick="edgeForward()">→</button>
  <button onclick="edgeRefresh()">⟳</button>
  <button onclick="edgeHome()">⌂</button>
  <input id="edgeUrl" value="${escapeAttr(url)}" placeholder="検索またはURLを入力">
  <button onclick="edgeGo()">移動</button>
 </div>
 <div class="edgeArea">
  <iframe id="edgeFrame" class="edgeFrame"
   src="about:blank"
   sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
 </div>`;
}
let edgeHistory=[],edgePos=-1;
function initEdge(url){
 navigateEdge(windows.edge,url||"https://www.bing.com");
 const input=$("edgeUrl");
 if(input)input.onkeydown=e=>{if(e.key==="Enter")edgeGo()};
}
function navigateEdge(w,url){
 if(!w)return;
 let inp=w.querySelector("#edgeUrl");
 let frame=w.querySelector("#edgeFrame");
 if(!inp||!frame)return;
 url=normalizeURL(url);
 inp.value=url;
 frame.src=url;
 edgeHistory.push(url);edgePos=edgeHistory.length-1;
}
function normalizeURL(url){
 url=(url||"").trim();
 if(!url)return "https://www.bing.com";
 if(!/^https?:\/\//i.test(url)){
  if(url.includes(".")&&!url.includes(" "))url="https://"+url;
  else url="https://www.bing.com/search?q="+encodeURIComponent(url);
 }
 return url;
}
function edgeGo(){
 let w=windows.edge;if(!w)return;
 navigateEdge(w,w.querySelector("#edgeUrl").value);
}
function edgeHome(){navigateEdge(windows.edge,"https://www.bing.com")}
function edgeRefresh(){
 const f=windows.edge?.querySelector("#edgeFrame");
 if(f)f.src=f.src;
}
function edgeBack(){
 if(edgePos>0){
  edgePos--;
  let w=windows.edge;
  w.querySelector("#edgeUrl").value=edgeHistory[edgePos];
  w.querySelector("#edgeFrame").src=edgeHistory[edgePos];
 }
}
function edgeForward(){
 if(edgePos<edgeHistory.length-1){
  edgePos++;
  let w=windows.edge;
  w.querySelector("#edgeUrl").value=edgeHistory[edgePos];
  w.querySelector("#edgeFrame").src=edgeHistory[edgePos];
 }
}
function edgeNewTab(){navigateEdge(windows.edge,"https://www.bing.com")}
function escapeAttr(s){
 return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function initCalc(){}
function calcPress(v){
 let d=$("calcDisplay");
 if(!d)return;
 if(v==="C"){d.value="0";return}
 if(v==="="){
  try{
   let s=d.value.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
   if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;
   d.value=String(Function("return "+s)());
  }catch{d.value="Error"}
  return;
 }
 d.value=d.value==="0"?v:d.value+v;
}

/* ===== ペイント ===== */
function paintApp(){
 return `<div class="paintTools">
 <label>色 <input type="color" id="paintColor" value="#000000"></label>
 <label>太さ <input type="range" id="paintSize" min="1" max="40" value="5"></label>
 <button onclick="paintClear()">消去</button>
 <button onclick="paintSave()">画像保存</button>
 </div>
 <canvas id="paintCanvas" class="paintCanvas" width="900" height="500"></canvas>`;
}
let drawing=false,lastX=0,lastY=0,ctx;
function initPaint(){
 const c=$("paintCanvas");if(!c)return;
 ctx=c.getContext("2d");
 ctx.fillStyle="white";ctx.fillRect(0,0,c.width,c.height);
 c.onpointerdown=e=>{
  drawing=true;const r=c.getBoundingClientRect();
  lastX=(e.clientX-r.left)*c.width/r.width;
  lastY=(e.clientY-r.top)*c.height/r.height;
 };
 c.onpointermove=e=>{
  if(!drawing)return;
  const r=c.getBoundingClientRect();
  let x=(e.clientX-r.left)*c.width/r.width;
  let y=(e.clientY-r.top)*c.height/r.height;
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);
  ctx.strokeStyle=$("paintColor").value;
  ctx.lineWidth=$("paintSize").value;
  ctx.lineCap="round";ctx.stroke();
  lastX=x;lastY=y;
 };
 c.onpointerup=()=>drawing=false;
 c.onpointerleave=()=>drawing=false;
}
function paintClear(){
 if(!ctx)return;
 ctx.fillStyle="white";ctx.fillRect(0,0,900,500);
}
function paintSave(){
 const c=$("paintCanvas");
 if(!c)return;
 let a=document.createElement("a");
 a.download="paint.png";a.href=c.toDataURL();a.click();
}
