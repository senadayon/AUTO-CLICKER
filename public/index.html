
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUTO CLICKER v4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090711;color:#f5f0ff;font-family:Arial,sans-serif}
header{padding:18px 22px;background:#120d20;border-bottom:1px solid #392653;display:flex;justify-content:space-between;align-items:center}
.logo{color:#c084fc;font-size:23px;font-weight:900;letter-spacing:2px}
main{width:min(1100px,94%);margin:25px auto}
.panel{background:#151020;border:1px solid #392653;border-radius:16px;padding:20px;margin-bottom:20px}
h2{color:#c084fc;margin-top:0}
input{background:#0c0914;color:white;border:1px solid #493365;padding:13px;border-radius:9px;width:100%;min-width:0}
button{background:#8b5cf6;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer;font-weight:bold}
button:hover{background:#a78bfa}
button:disabled{opacity:.4;cursor:not-allowed}
.red{background:#be315b}
.gray{background:#393047}
.searchrow,.browserbar{display:flex;gap:9px}
.results{margin-top:15px;display:grid;gap:10px}
.result{background:#211832;border:1px solid #493365;border-radius:12px;padding:14px}
.result a{color:#c084fc;font-weight:bold;text-decoration:none}
.result p{color:#aaa0bb;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.browserbar{margin-bottom:12px}
.browserbar input{flex:1}
iframe{width:100%;height:520px;background:white;border:1px solid #493365;border-radius:12px}
.notice{color:#aaa0bb;font-size:12px;line-height:1.7}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{display:block;color:#c4b5fd;font-size:13px;margin-bottom:8px}
.counter{font-size:40px;color:#c084fc;font-weight:bold;margin:15px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.status{padding:12px;background:#211832;border-radius:9px;margin-top:12px}
.mode{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.mode button.active{outline:2px solid #e9d5ff;background:#6d28d9}
#pickOverlay{position:fixed;inset:0;z-index:99999;display:none;cursor:crosshair;background:#0003}
#pickHint{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#211832;color:white;padding:12px 18px;border:1px solid #c084fc;border-radius:10px;z-index:100000;display:none}
.ac-highlight{outline:3px solid #c084fc!important;outline-offset:3px!important}
footer{text-align:center;padding:25px;color:#766b88}
@media(max-width:600px){.controls{grid-template-columns:1fr}.searchrow{flex-direction:column}iframe{height:400px}main{margin:15px auto}.panel{padding:15px}}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ AUTO CLICKER</div>
  <span style="color:#a78bfa;font-size:12px">VERSION 4.0</span>
</header>

<main>
<section class="panel">
<h2>🔎 BING SEARCH</h2>
<form id="searchForm" class="searchrow">
<input id="searchInput" placeholder="検索したい言葉を入力..." required>
<button type="submit">検索</button>
</form>
<div id="searchStatus" class="notice"></div>
<div id="results" class="results"></div>
</section>

<section class="panel">
<h2>🌐 INTERNAL BROWSER</h2>
<div class="browserbar">
<input id="urlInput" placeholder="https://example.com">
<button id="goButton">開く</button>
</div>
<iframe id="browser" title="AUTO CLICKER browser"
src="about:blank" referrerpolicy="no-referrer"></iframe>
<p class="notice">
iframe表示を許可しているサイトを開けます。
外部サイトの内部はブラウザの安全制限により操作できません。
</p>
</section>

<section class="panel">
<h2>⚡ AUTO CLICKER</h2>

<label>選択方式</label>
<div class="mode">
<button id="coordinateMode" class="active">🎯 座標で選択</button>
<button id="elementMode">🔘 ボタンを直接選択</button>
</div>

<div class="controls">
<div>
<label>クリック間隔（ms）</label>
<input id="interval" type="number" min="100" max="10000" value="500">
</div>
<div>
<label>クリック回数（0 = 無制限）</label>
<input id="maxClicks" type="number" min="0" max="1000" value="20">
</div>
</div>

<div class="counter" id="counter">0</div>
<div class="notice">TOTAL CLICKS</div>
<div id="targetInfo" class="notice">対象：未選択</div>

<div class="actions">
<button id="pick">🎯 位置を選択</button>
<button id="start">▶ START</button>
<button id="stop" class="red" disabled>■ STOP</button>
<button id="reset" class="gray">↻ RESET</button>
</div>

<div id="status" class="status notice">選択方式を選んで対象を指定してください。</div>
</section>
</main>

<div id="pickOverlay"></div>
<div id="pickHint">対象をクリックして選択してください（キャンセル：Esc）</div>

<footer>AUTO CLICKER © 2026</footer>

<script>
const $ = id => document.getElementById(id);
const browser = $("browser");

let target = null;
let mode = "coordinate";
let timer = null;
let running = false;
let clicks = 0;
let selecting = false;
let lastHighlighted = null;

function openWebsite(value){
  try{
    const url = new URL(value);
    if(!["http:","https:"].includes(url.protocol)) throw Error();
    $("urlInput").value = url.href;
    browser.src = url.href;
    $("status").textContent = "サイトを開いています。";
    clearTarget();
  }catch{
    alert("正しいURLを入力してください");
  }
}

$("goButton").onclick = () => openWebsite($("urlInput").value.trim());
$("urlInput").onkeydown = e => {
  if(e.key === "Enter") openWebsite($("urlInput").value.trim());
};

$("searchForm").onsubmit = async e => {
  e.preventDefault();
  const q = $("searchInput").value.trim();
  if(!q) return;

  $("searchStatus").textContent = "Bingで検索中...";
  $("results").replaceChildren();

  try{
    const response = await fetch("/api/search?q=" + encodeURIComponent(q));
    const data = await response.json();
    if(!response.ok) throw Error(data.error || "検索できませんでした");

    $("searchStatus").textContent = data.results.length + "件の検索結果";

    data.results.forEach(item => {
      const card = document.createElement("div");
      card.className = "result";

      const link = document.createElement("a");
      link.href = "#";
      link.textContent = item.title || item.url;
      link.onclick = e => {
        e.preventDefault();
        openWebsite(item.url);
      };

      const desc = document.createElement("p");
      desc.textContent = item.description || "";

      const address = document.createElement("p");
      address.textContent = item.url;

      card.append(link,desc,address);
      $("results").appendChild(card);
    });
  }catch(error){
    $("searchStatus").textContent = error.message;
  }
};

function clearTarget(){
  if(lastHighlighted){
    lastHighlighted.classList.remove("ac-highlight");
    lastHighlighted = null;
  }
  target = null;
  $("targetInfo").textContent = "対象：未選択";
}

function cancelPicking(){
  selecting = false;
  $("pickOverlay").style.display = "none";
  $("pickHint").style.display = "none";
}

function beginPicking(){
  if(running) return;

  selecting = true;
  $("pickOverlay").style.display = "block";
  $("pickHint").style.display = "block";

  $("status").textContent = mode === "coordinate"
    ? "AUTO CLICKER自身のページ内の位置をクリックしてください。"
    : "AUTO CLICKER自身のページ内のボタンをクリックしてください。";
}

$("coordinateMode").onclick = () => {
  if(running) return;
  mode = "coordinate";
  $("coordinateMode").classList.add("active");
  $("elementMode").classList.remove("active");
  clearTarget();
  $("status").textContent = "座標選択モードです。";
};

$("elementMode").onclick = () => {
  if(running) return;
  mode = "element";
  $("elementMode").classList.add("active");
  $("coordinateMode").classList.remove("active");
  clearTarget();
  $("status").textContent = "ボタン選択モードです。";
};

$("pick").onclick = beginPicking;

$("pickOverlay").onclick = e => {
  if(!selecting) return;

  const x = e.clientX;
  const y = e.clientY;
  const element = document.elementFromPoint(x,y);

  if(!element || element === $("pickOverlay") ||
     element === $("pickHint")){
    return;
  }

  if(element.closest("header,footer") ||
     element.closest("#pickOverlay,#pickHint")){
    $("status").textContent = "操作対象にできない場所です。";
    return;
  }

  if(mode === "element"){
    const button = element.closest("button,[role='button'],input[type='button'],input[type='submit'],a");
    if(!button){
      $("status").textContent = "ボタンを選択してください。";
      return;
    }
    target = {type:"element",element:button};
    button.classList.add("ac-highlight");
    lastHighlighted = button;
    $("targetInfo").textContent =
      "対象ボタン：" + (button.innerText || button.value || button.tagName).trim().slice(0,60);
  }else{
    target = {type:"coordinate",x,y};
    $("targetInfo").textContent =
      "座標：" + Math.round(x) + ", " + Math.round(y);
  }

  cancelPicking();
  $("status").textContent = "対象を設定しました。";
};

document.addEventListener("keydown",e => {
  if(e.key === "Escape" && selecting){
    cancelPicking();
    $("status").textContent = "選択をキャンセルしました。";
  }
});

function clickTarget(){
  if(!target) return;

  if(target.type === "element"){
    if(!target.element.isConnected){
      stop();
      $("status").textContent = "選択したボタンがページからなくなりました。";
      return;
    }

    target.element.click();
  }else{
    const element = document.elementFromPoint(target.x,target.y);
    if(element){
      element.click();
    }
  }
}

function stop(){
  if(timer) clearInterval(timer);
  timer = null;
  running = false;
  $("start").disabled = false;
  $("stop").disabled = true;
  if($("status").textContent !== "選択したボタンがページからなくなりました。"){
    $("status").textContent = "停止しました。";
  }
}

$("start").onclick = () => {
  if(!target){
    $("status").textContent = "先にクリック対象を選択してください。";
    return;
  }

  const interval = Number($("interval").value);
  const max = Number($("maxClicks").value);

  if(!Number.isInteger(interval) || interval < 100 || interval > 10000 ||
     !Number.isInteger(max) || max < 0 || max > 1000){
    alert("間隔または回数を確認してください。");
    return;
  }

  clicks = 0;
  $("counter").textContent = "0";
  running = true;
  $("start").disabled = true;
  $("stop").disabled = false;
  $("status").textContent = "クリック動作中です。";

  timer = setInterval(() => {
    if(!running) return;

    clickTarget();
    if(!running) return;

    clicks++;
    $("counter").textContent = clicks;

    if(max !== 0 && clicks >= max) stop();
  },interval);
};

$("stop").onclick = stop;

$("reset").onclick = () => {
  stop();
  cancelPicking();
  clearTarget();
  clicks = 0;
  $("counter").textContent = "0";
  $("status").textContent = "リセットしました。";
};
</script>
</body>
</html>
