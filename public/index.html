<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Windows</title>
<style>
*{box-sizing:border-box}
:root{
 --accent:#60a5fa;
 --bg:#172033;
 --glass:rgba(25,35,55,.88);
 --text:#fff;
}
body{
 margin:0;font-family:"Segoe UI",Arial,sans-serif;
 overflow:hidden;background:#111;color:var(--text);
}
button,input{font:inherit}
button{
 border:0;border-radius:8px;padding:9px 13px;
 cursor:pointer;color:inherit;background:#ffffff18;
}
button:hover{background:#ffffff30}
#boot{
 position:fixed;inset:0;background:#05070d;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;z-index:9999;
}
#bootLogo{font-size:65px;margin-bottom:25px}
#bootText{color:#aaa}
#login{
 display:none;position:fixed;inset:0;z-index:9998;
 background:linear-gradient(135deg,#18284b,#263c70,#111827);
 align-items:center;justify-content:center;text-align:center;
}
.loginbox{background:#ffffff12;padding:35px;border-radius:20px;backdrop-filter:blur(20px)}
.loginbox input{padding:12px;border-radius:9px;border:0;margin:10px;color:#111}
#desktop{
 display:none;position:fixed;inset:0;
 background:linear-gradient(135deg,#12365e,#315b95,#16294a);
 background-size:cover;background-position:center;
}
#icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;flex-wrap:wrap;max-height:calc(100% - 65px)}
.desktopIcon{
 width:88px;min-height:88px;text-align:center;padding:7px;
 border-radius:8px;cursor:pointer;user-select:none;
}
.desktopIcon:hover{background:#ffffff25}
.desktopIcon .emoji{font-size:35px;display:block;margin-bottom:5px}
.desktopIcon span:last-child{font-size:12px;text-shadow:0 1px 4px #000}
#taskbar{
 position:absolute;bottom:0;left:0;right:0;height:48px;
 background:rgba(18,25,38,.75);backdrop-filter:blur(20px);
 display:flex;align-items:center;justify-content:center;gap:5px;
 border-top:1px solid #ffffff18;
}
#taskLeft{position:absolute;left:10px;display:flex;gap:8px}
#taskCenter{display:flex;gap:4px}
#taskRight{position:absolute;right:12px;display:flex;align-items:center;gap:8px;font-size:12px}
.taskbtn{height:38px;min-width:38px;font-size:20px}
#startBtn{font-size:23px}
#taskClock{text-align:right;cursor:pointer}
#startMenu{
 display:none;position:absolute;bottom:55px;left:50%;
 transform:translateX(-50%);width:360px;height:480px;
 background:var(--glass);backdrop-filter:blur(25px);
 border:1px solid #ffffff20;border-radius:16px;padding:15px;
 box-shadow:0 15px 40px #0008;
}
#startMenu input{width:100%;padding:12px;border-radius:10px;border:0;background:#ffffff20;color:white}
#startApps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.startApp{text-align:center;padding:10px 3px;cursor:pointer;border-radius:8px}
.startApp:hover{background:#ffffff20}
.startApp .emoji{font-size:27px;display:block}
.startApp small{font-size:11px}
#startBottom{position:absolute;bottom:10px;left:12px;right:12px;display:flex;justify-content:space-between}
.window{
 position:absolute;top:70px;left:100px;width:750px;height:500px;
 max-width:calc(100vw - 20px);max-height:calc(100vh - 65px);
 background:#202b3c;color:white;border:1px solid #ffffff30;
 border-radius:12px;overflow:hidden;box-shadow:0 15px 45px #0007;
 display:flex;flex-direction:column;
}
.window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 48px)!important;border-radius:0}
.winHead{
 height:38px;flex-shrink:0;display:flex;align-items:center;
 justify-content:space-between;background:#182333;padding:0 10px;
 cursor:move;user-select:none;
}
.winTitle{font-size:13px}
.winControls{display:flex;gap:4px}
.winControls button{padding:4px 10px;border-radius:5px}
.winBody{flex:1;overflow:auto;padding:12px}
.winBody.noPad{padding:0}
.winBody input,.winBody textarea,.winBody select{
 padding:10px;border-radius:7px;border:1px solid #888;background:#fff;color:#111;
}
.winBody textarea{width:100%;height:100%;resize:none}
.winBody iframe{width:100%;height:100%;border:0;background:white}
.winBody button{margin:3px}
#context{
 display:none;position:fixed;z-index:99999;width:190px;
 background:#263246;border:1px solid #ffffff30;border-radius:10px;
 box-shadow:0 8px 30px #0008;padding:5px;
}
#context button{display:block;width:100%;text-align:left;padding:9px;font-size:13px}
#context hr{border-color:#ffffff20}
#quick{
 display:none;position:absolute;right:10px;bottom:55px;width:300px;
 background:var(--glass);backdrop-filter:blur(25px);border-radius:15px;padding:15px;
}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quickgrid button{padding:14px}
#calendarPopup{
 display:none;position:absolute;right:10px;bottom:55px;width:300px;
 background:var(--glass);backdrop-filter:blur(20px);border-radius:15px;padding:15px;
}
#cursorImg{
 display:none;position:fixed;left:0;top:0;width:32px;height:32px;
 pointer-events:none;z-index:999999;object-fit:contain;
}
.browser{display:flex;flex-direction:column;height:100%;background:#f2f3f5;color:#111}
.tabs{display:flex;align-items:center;background:#e0e3e8;padding:4px;gap:4px}
.tab{padding:8px 12px;background:#f2f3f5;border-radius:9px 9px 0 0;min-width:100px;max-width:200px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.tab.active{background:#fff}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabclose{padding:0 5px;color:#333}
.browserbar{display:flex;align-items:center;padding:6px;gap:5px;background:#f2f3f5}
.browserbar button{color:#222;padding:8px}
.browserbar input{flex:1;border-radius:20px;border:1px solid #ccc;padding:9px 15px}
.browserContent{flex:1;min-height:0;background:white}
.browserContent iframe{width:100%;height:100%;border:0}
.appGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.appCard{background:#ffffff12;border-radius:12px;padding:12px;text-align:center}
.appCard .emoji{font-size:36px}
.appCard p{font-size:12px;color:#ccc}
.appCard button{width:100%;margin-top:5px}
.settingsNav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.settingsNav button{font-size:12px}
#toast{
 position:fixed;bottom:65px;left:50%;transform:translateX(-50%);
 background:#222;padding:12px 20px;border-radius:10px;display:none;z-index:100000;
}
@media(max-width:600px){
 .window{top:10px;left:5px;width:calc(100vw - 10px);height:calc(100vh - 65px)}
 #startMenu{width:calc(100vw - 20px)}
 #taskLeft{display:none}
 #icons{max-height:calc(100% - 60px)}
}
</style>
</head>
<body>

<div id="boot">
 <div id="bootLogo">🪟</div>
 <div id="bootText">Web Windows を起動しています...</div>
</div>

<div id="login">
 <div class="loginbox">
  <div style="font-size:60px">👤</div>
  <h2 id="loginName">User</h2>
  <input id="pinInput" placeholder="PIN (空欄でもOK)" type="password">
  <br><button onclick="enterDesktop()">ログイン →</button>
 </div>
</div>

<div id="desktop">
 <div id="icons"></div>
 <div id="windows"></div>

 <div id="startMenu">
  <input id="startSearch" placeholder="アプリや検索..." oninput="renderStart()">
  <div id="startApps"></div>
  <div id="startBottom">
   <button onclick="openApp('Settings')">⚙ 設定</button>
   <button onclick="logout()">⏻ 電源</button>
  </div>
 </div>

 <div id="quick">
  <div class="quickgrid">
   <button onclick="toast('Wi-Fi 設定')">📶 Wi-Fi</button>
   <button onclick="toast('Bluetooth')">ᛒ Bluetooth</button>
   <button onclick="toggleTheme()">🌙 テーマ</button>
   <button onclick="openApp('Settings')">⚙ 設定</button>
  </div>
  <p>🔆 明るさ</p><input type="range" min="30" max="100" value="100" onchange="document.getElementById('desktop').style.filter='brightness('+this.value+'%)'">
  <p>🔊 音量</p><input type="range" min="0" max="100" value="70">
 </div>

 <div id="calendarPopup">
  <h3 id="calTime"></h3>
  <div id="calDate"></div>
  <hr>
  <div id="calMonth"></div>
 </div>

 <div id="taskbar">
  <div id="taskLeft"><button class="taskbtn" onclick="openApp('Files')">📁</button></div>
  <div id="taskCenter">
   <button class="taskbtn" id="startBtn" onclick="toggleStart()">🪟</button>
   <button class="taskbtn" onclick="openApp('Browser')">🌐</button>
   <button class="taskbtn" onclick="openApp('Store')">🛍️</button>
   <button class="taskbtn" onclick="openApp('Settings')">⚙️</button>
  </div>
  <div id="taskRight">
   <button onclick="toggleQuick()">📶 🔊</button>
   <div id="taskClock" onclick="toggleCalendar()"><span id="clock"></span><br><span id="clockDate"></span></div>
  </div>
 </div>
</div>

<div id="context"></div>
<div id="toast"></div>
<img id="cursorImg">
<input id="cursorUpload" type="file" accept="image/*" hidden>

<script>
const $=id=>document.getElementById(id);
const storage=(key,val)=>{
 if(val===undefined){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
 localStorage.setItem(key,JSON.stringify(val));
};
const defaults={
 wallpaper:"linear-gradient(135deg,#12365e,#315b95,#16294a)",
 accent:"#60a5fa",name:"User",cursor:null,installed:[],
 pinned:[],theme:"dark"
};
let settings={...defaults,...(storage("wwSettings")||{})};
function saveSettings(){storage("wwSettings",settings)}
const apps={
 Browser:{name:"Microsoft Edge",icon:"🌐",desc:"ウェブブラウザ"},
 Settings:{name:"設定",icon:"⚙️",desc:"デスクトップの設定"},
 Store:{name:"アプリストア",icon:"🛍️",desc:"アプリをインストール"},
 Notepad:{name:"メモ帳",icon:"📝",desc:"テキストメモ"},
 Calculator:{name:"電卓",icon:"🧮",desc:"計算"},
 Paint:{name:"ペイント",icon:"🎨",desc:"お絵描き"},
 Files:{name:"ファイル",icon:"📁",desc:"ファイル管理"},
 Calendar:{name:"カレンダー",icon:"📅",desc:"カレンダー"},
 Clock:{name:"時計",icon:"⏰",desc:"時計"},
 Photos:{name:"写真",icon:"🖼️",desc:"画像ビューア"},
 Game:{name:"ミニゲーム",icon:"🎮",desc:"数字当てゲーム"},
 About:{name:"このPCについて",icon:"💻",desc:"Web Windows"}
};
const storeApps={
 Clock:{name:"時計",icon:"⏰",desc:"時計とストップウォッチ"},
 Photos:{name:"写真",icon:"🖼️",desc:"画像を表示"},
 Game:{name:"ミニゲーム",icon:"🎮",desc:"数字当てゲーム"},
 Calendar:{name:"カレンダー",icon:"📅",desc:"日付を見る"},
 Paint:{name:"ペイント",icon:"🎨",desc:"簡易お絵描き"},
 Notepad:{name:"メモ帳",icon:"📝",desc:"文章を書く"}
};
let openWindows={};
let z=10;
let browserTabs=[];
let activeTab=0;
let notes=localStorage.getItem("wwNote")||"";
let files=storage("wwFiles")||[];
let gameNumber=Math.floor(Math.random()*100)+1;

function init(){
 setTimeout(()=>{
  $("boot").style.display="none";
  $("login").style.display="flex";
  $("loginName").textContent=settings.name||"User";
 },900);
}
function enterDesktop(){
 if($("pinInput").value && $("pinInput").value!=="1234"){
  toast("PINが違います（初期PINは1234）");return;
 }
 $("login").style.display="none";
 $("desktop").style.display="block";
 applySettings();renderIcons();renderStart();updateClock();
}
function logout(){
 $("desktop").style.display="none";$("login").style.display="flex";
 $("pinInput").value="";
}
function applySettings(){
 $("desktop").style.background=settings.wallpaper;
 document.documentElement.style.setProperty("--accent",settings.accent);
 if(settings.cursor){
  $("cursorImg").src=settings.cursor;
  $("cursorImg").style.display="block";
  document.body.style.cursor="none";
 }else{
  $("cursorImg").style.display="none";
  document.body.style.cursor="default";
 }
}
document.addEventListener("mousemove",e=>{
 if(settings.cursor){
  $("cursorImg").style.left=e.clientX+"px";
  $("cursorImg").style.top=e.clientY+"px";
 }
});
document.addEventListener("mousedown",e=>{
 if(settings.cursor){
  $("cursorImg").style.width="28px";$("cursorImg").style.height="28px";
 }
});
document.addEventListener("mouseup",()=>{
 if(settings.cursor){
  $("cursorImg").style.width="32px";$("cursorImg").style.height="32px";
 }
});
$("cursorUpload").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(f.size>500000){toast("画像は500KB以下にしてね");return}
 const reader=new FileReader();
 reader.onload=()=>{
  settings.cursor=reader.result;saveSettings();applySettings();
  toast("カーソルを変更しました");
 };
 reader.readAsDataURL(f);
};
function renderIcons(){
 const list=["Browser","Store","Settings",...settings.installed];
 $("icons").innerHTML="";
 list.forEach(id=>{
  if(!apps[id])return;
  let div=document.createElement("div");
  div.className="desktopIcon";
  div.dataset.app=id;
  div.innerHTML=`<span class="emoji">${apps[id].icon}</span><span>${apps[id].name}</span>`;
  div.ondblclick=()=>openApp(id);
  div.onclick=()=>{document.querySelectorAll(".desktopIcon").forEach(x=>x.style.background="");div.style.background="#ffffff35"};
  div.oncontextmenu=e=>{e.preventDefault();contextMenu(e.clientX,e.clientY,id)};
  $("icons").appendChild(div);
 });
}
function renderStart(){
 let q=$("startSearch").value.toLowerCase();
 let list=["Browser","Store","Settings",...settings.installed,"Notepad","Calculator","Files","About"];
 list=[...new Set(list)].filter(id=>apps[id]&&apps[id].name.toLowerCase().includes(q));
 $("startApps").innerHTML=list.map(id=>`
 <div class="startApp" onclick="openApp('${id}');toggleStart()">
  <span class="emoji">${apps[id].icon}</span><small>${apps[id].name}</small>
 </div>`).join("");
}
function toggleStart(){
 $("startMenu").style.display=$("startMenu").style.display==="block"?"none":"block";
 $("quick").style.display="none";$("calendarPopup").style.display="none";
}
function toggleQuick(){
 $("quick").style.display=$("quick").style.display==="block"?"none":"block";
 $("startMenu").style.display="none";
}
function toggleCalendar(){
 $("calendarPopup").style.display=$("calendarPopup").style.display==="block"?"none":"block";
 $("quick").style.display="none";
}
function toggleTheme(){
 settings.theme=settings.theme==="dark"?"light":"dark";
 document.body.style.filter=settings.theme==="light"?"brightness(1.15)":"";
 saveSettings();
}
function updateClock(){
 let d=new Date();
 $("clock").textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
 $("clockDate").textContent=d.toLocaleDateString("ja-JP");
 $("calTime").textContent=d.toLocaleTimeString("ja-JP");
 $("calDate").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 $("calMonth").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long"});
 setTimeout(updateClock,1000);
}
function toast(msg){
 $("toast").textContent=msg;$("toast").style.display="block";
 setTimeout(()=>$("toast").style.display="none",2200);
}
function contextMenu(x,y,id){
 const c=$("context");c.innerHTML="";
 const add=(label,fn)=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>{c.style.display="none";fn()};c.appendChild(b)};
 add("📂 開く",()=>openApp(id));
 add("📌 スタートにピン留め",()=>{settings.pinned.push(id);saveSettings();toast("ピン留めしました")});
 add("📌 タスクバーにピン留め",()=>{toast("タスクバーに追加しました")});
 if(settings.installed.includes(id))add("🗑️ アンインストール",()=>uninstall(id));
 add("ℹ️ アプリ情報",()=>toast(apps[id].desc));
 c.style.display="block";c.style.left=Math.min(x,innerWidth-200)+"px";c.style.top=Math.min(y,innerHeight-220)+"px";
}
document.addEventListener("click",e=>{
 if(!$("context").contains(e.target))$("context").style.display="none";
});
$("desktop").oncontextmenu=e=>{
 if(e.target===$("desktop")||e.target===$("icons")){
 e.preventDefault();const c=$("context");c.innerHTML="";
 const add=(label,fn)=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>{c.style.display="none";fn()};c.appendChild(b)};
 add("🔄 更新",()=>renderIcons());
 add("⚙️ デスクトップ設定",()=>openApp("Settings"));
 add("🛍️ アプリストア",()=>openApp("Store"));
 c.style.display="block";c.style.left=e.clientX+"px";c.style.top=e.clientY+"px";
 }
};
function uninstall(id){
 settings.installed=settings.installed.filter(x=>x!==id);
 saveSettings();renderIcons();renderStart();
 closeApp(id);toast(apps[id].name+" を削除しました");
}
function closeApp(id){if(openWindows[id]){openWindows[id].remove();delete openWindows[id]}}
function openApp(id){
 if(!apps[id])return;
 $("startMenu").style.display="none";
 if(openWindows[id]){openWindows[id].style.display="flex";openWindows[id].style.zIndex=++z;return}
 let w=document.createElement("div");
 w.className="window";w.style.zIndex=++z;
 w.dataset.id=id;
 w.innerHTML=`<div class="winHead">
 <span class="winTitle">${apps[id].icon} ${apps[id].name}</span>
 <div class="winControls"><button class="min">－</button><button class="max">□</button><button class="close">✕</button></div>
 </div><div class="winBody"></div>`;
 $("windows").appendChild(w);openWindows[id]=w;
 let body=w.querySelector(".winBody");
 w.querySelector(".close").onclick=()=>closeApp(id);
 w.querySelector(".min").onclick=()=>w.style.display="none";
 w.querySelector(".max").onclick=()=>w.classList.toggle("maximized");
 w.onmousedown=()=>w.style.zIndex=++z;
 dragWindow(w);
 renderApp(id,body);
}
function dragWindow(w){
 let h=w.querySelector(".winHead"),sx,sy,ox,oy;
 h.onmousedown=e=>{
 if(e.target.closest("button"))return;
 if(w.classList.contains("maximized"))return;
 sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;
 document.onmousemove=m=>{w.style.left=ox+m.clientX-sx+"px";w.style.top=oy+m.clientY-sy+"px"};
 document.onmouseup=()=>{document.onmousemove=null;document.onmouseup=null};
 };
}
function renderApp(id,b){
 if(id==="Browser"){renderBrowser(b);return}
 if(id==="Store"){renderStore(b);return}
 if(id==="Settings"){renderSettings(b);return}
 if(id==="Notepad"){b.innerHTML=`<textarea id="noteArea">${escapeHtml(notes)}</textarea>`;
 b.querySelector("textarea").oninput=e=>{notes=e.target.value;localStorage.setItem("wwNote",notes)};return}
 if(id==="Calculator"){b.innerHTML=`<input id="calc" placeholder="例: 10+5*2"><button onclick="try{document.getElementById('calcResult').textContent=Function('return ('+document.getElementById('calc').value+')')()}catch{document.getElementById('calcResult').textContent='計算できません'}">計算</button><h2 id="calcResult"></h2>`;return}
 if(id==="Files"){renderFiles(b);return}
 if(id==="Paint"){renderPaint(b);return}
 if(id==="Calendar"){b.innerHTML="<h2>"+new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"})+"</h2>";return}
 if(id==="Clock"){b.innerHTML=`<h1 id="appClock"></h1><button onclick="startStopwatch(this)">▶ ストップウォッチ</button><div id="stopwatch">0</div>`;clockApp(b);return}
 if(id==="Photos"){b.innerHTML=`<input type="file" accept="image/*" onchange="showPhoto(this)"><div id="photoView"></div>`;return}
 if(id==="Game"){b.innerHTML=`<h2>数字当てゲーム</h2><p>1〜100の数字を当てよう！</p><input id="guess" type="number"><button onclick="guessGame()">予想</button><p id="gameResult"></p><button onclick="gameNumber=Math.floor(Math.random()*100)+1;document.getElementById('gameResult').textContent='新しい数字にしたよ！'">新しいゲーム</button>`;return}
 if(id==="About"){b.innerHTML="<h2>Web Windows</h2><p>ブラウザ上で動くWindows風デスクトップ</p><p>Version 1.0</p>";return}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
