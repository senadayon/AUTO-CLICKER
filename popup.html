
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 280px;
    padding: 18px;
    margin: 0;
    background: #100b20;
    color: white;
    font-family: Arial, sans-serif;
  }

  h2 {
    color: #c084fc;
    text-align: center;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: 0;
    border-radius: 9px;
    background: #7929c7;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  p {
    color: #c4b5fd;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <h2>AUTO CLICKER</h2>
  <p>ALL WEBSITE MODE</p>

  <button id="open">操作パネルを開く</button>

  <script>
    document.getElementById("open").onclick = async () => {
      const [tab] = await chrome.tabs.query({
        active: true,
        currentWindow: true
      });

      if (!tab || !tab.id) return;

      try {
        await chrome.tabs.sendMessage(tab.id, {
          type: "TOGGLE_AUTO_CLICKER"
        });
        window.close();
      } catch (error) {
        alert("このページでは拡張機能を使えません。");
      }
    };
  </script>
</body>
</html>
